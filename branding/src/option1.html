<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Option 1 - Gilded Panel</title>
<!-- Option 1 "Gilded Panel": the look of the game's own UI panels. Warm dark leather, a double gold hairline frame with
     diamond corners, Alegreya SC titles (the docs site's display face), real screenshots set in gold-ruled frames. -->
<link rel="stylesheet" href="common.css">
<style>
  .stage { position: absolute; inset: 0; overflow: hidden;
    background: radial-gradient(ellipse 70% 80% at 28% 45%, #261e16 0%, #15100c 55%, #0a0806 100%); }
  .frame { position: absolute; inset: var(--fi, 26px); border: 1px solid #6e5634; pointer-events: none; z-index: 20; }
  .frame::before { content: ""; position: absolute; inset: 7px; border: 1px solid rgba(110, 86, 52, .45); }
  .frame i { position: absolute; width: var(--cd, 16px); height: var(--cd, 16px); transform: translate(-50%, -50%) rotate(45deg);
    background: linear-gradient(135deg, #fff0c8, #d2a253 50%, #7a5528); box-shadow: 0 0 0 3px #0f0b08; }
  .m-la .frame i.c { background: var(--prism); }
  .eyebrow { font-family: "Alegreya Sans SC", sans-serif; font-weight: 700; letter-spacing: .22em; color: #a8957a; text-transform: lowercase; }
  .title { font-family: "Alegreya SC", serif; font-weight: 700; line-height: .92; letter-spacing: .01em;
    background: linear-gradient(180deg, #fff6df 0%, #efd7a2 55%, #b98c46 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 3px 0 rgba(0,0,0,.55)); }
  .divider { display: flex; align-items: center; gap: 14px; }
  .divider::before, .divider::after { content: ""; height: 1px; flex: 1; background: linear-gradient(90deg, transparent, #8a6d42); }
  .divider::after { background: linear-gradient(90deg, #8a6d42, transparent); }
  .divider b { width: 12px; height: 12px; transform: rotate(45deg); background: linear-gradient(135deg, #fff0c8, #d2a253 50%, #7a5528); }
  .m-la .divider b { background: var(--prism); }
  .tag { font-style: italic; color: #dccfb4; }
  .feats { list-style: none; color: #c9bca3; }
  .feats li { display: flex; align-items: center; gap: .7em; margin-top: .45em; }
  .feats li::before { content: ""; width: .42em; height: .42em; transform: rotate(45deg); flex: none; background: #c99a4c; }
  .m-la .feats li::before { background: var(--prism); }
  .kbd { display: inline-flex; align-items: center; gap: .6em; font-family: "Alegreya Sans SC", sans-serif; letter-spacing: .12em; color: #a8957a; }
  .kbd b { font-family: "IBM Plex Mono", monospace; letter-spacing: 0; color: #f3e3bd; border: 1px solid #8a6d42; border-bottom-width: 3px; padding: .05em .5em; border-radius: 5px; background: #221a12; }
  /* plate = the in-game ability-icon style tile that holds the emblem */
  .plate { position: relative; width: var(--p); height: var(--p); border-radius: 16%; padding: calc(var(--p) * .035);
    background: linear-gradient(135deg, #fff0c8, #c99a4c 40%, #6e4a1f 70%, #e2bd76); box-shadow: 0 calc(var(--p) * .06) calc(var(--p) * .16) rgba(0,0,0,.6); flex: none; }
  .m-la .plate { background: linear-gradient(135deg, #fff0c8, #c99a4c 40%, #6e4a1f 70%, #e2bd76); }
  .plate .in { position: relative; width: 100%; height: 100%; border-radius: 13%; background: radial-gradient(circle at 50% 38%, #3a2c1f, #140f0b 75%);
    display: grid; place-items: center; overflow: hidden; box-shadow: inset 0 0 0 calc(var(--p) * .014) rgba(0,0,0,.8), inset 0 0 calc(var(--p) * .2) rgba(0,0,0,.7); }
  .plate .in::after { content: ""; position: absolute; inset: 7%; border-radius: 10%; border: 1px solid rgba(226, 189, 118, .28); }
  .plate .halo { width: 150%; height: 150%; }
  .pic { position: absolute; border: 1px solid #8a6d42; box-shadow: 0 0 0 5px rgba(12, 9, 7, .9), 0 0 0 6px rgba(138, 109, 66, .5), 0 34px 70px rgba(0,0,0,.75); background: #000; overflow: hidden; }
  .pic img { width: 100%; height: 100%; object-fit: cover; }
  .pic.round { border-radius: 50%; border: 3px solid #b68b4c; }
  .cap { position: absolute; font-family: "Alegreya Sans SC", sans-serif; font-weight: 700; letter-spacing: .2em; font-size: 15px; color: #a8957a; text-transform: lowercase;
    background: #120e0b; padding: 3px 10px; border: 1px solid #5b4a33; z-index: 5; }
  .glass { position: absolute; background: rgba(16, 11, 9, .9); border: 1px solid #6e3a30; padding: 16px 22px; box-shadow: 0 30px 70px rgba(0,0,0,.7); }
  .abs { position: absolute; }
</style>
</head>
<body>
<div class="stage grain" id="stage"></div>
<script src="common.js"></script>
<script>
const { MOD, FMT, M, emblem, baWindow, baMenu } = BR;
document.body.classList.add("m-" + MOD);
const S = document.getElementById("stage");

function plate(p, small) {
  return `<div class="plate" style="--p:${p}px"><div class="in"><div class="halo" style="--s:${p * .6}px"></div>${emblem(MOD, p * (small ? .74 : .64), small)}</div></div>`;
}
function frame(inset, cd) {
  return `<div class="frame" style="--fi:${inset}px;--cd:${cd}px"><i class="c" style="left:0;top:0"></i><i class="c" style="left:100%;top:0"></i><i class="c" style="left:0;top:100%"></i><i class="c" style="left:100%;top:100%"></i><i style="left:50%;top:0;--cd:${cd * .6}px;width:${cd * .6}px;height:${cd * .6}px"></i><i style="left:50%;top:100%;width:${cd * .6}px;height:${cd * .6}px"></i></div>`;
}
function stampOrKey(fs) {
  return M.private ? `<span class="stamp dashed" style="--fs:${fs * .78}px">Private tool · not released</span>`
                   : `<span class="kbd" style="font-size:${fs}px"><b>${M.hotkey}</b>${MOD === "la" ? "item list" : "advisor window"}</span>`;
}
function textBlock(o) {
  return `<div class="abs" style="left:${o.x}px;top:${o.y}px;width:${o.w}px">
    ${o.plate ? `<div style="margin-bottom:${o.plate * .2}px">${plate(o.plate)}</div>` : ""}
    <div class="eyebrow" style="font-size:${o.eb}px;margin-bottom:${o.eb * .7}px">${M.eyebrow}</div>
    <div class="title" style="font-size:${o.t}px">${M.name}</div>
    <div class="divider" style="margin:${o.t * .2}px 0 ${o.t * .16}px;width:${o.dw || o.w * .8}px"><b></b></div>
    <div class="tag" style="font-size:${o.tg}px;line-height:1.25">${M.tag}</div>
    ${o.feats ? `<ul class="feats" style="font-size:${o.feats}px;margin-top:${o.feats * 1.1}px">${M.feats.map(f => `<li>${f}</li>`).join("")}</ul>` : ""}
    ${o.key ? `<div style="margin-top:${o.key * 1.6}px">${stampOrKey(o.key)}</div>` : ""}
  </div>`;
}
const pic = (src, x, y, w, h, extra) => `<div class="pic ${extra || ""}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"><img src="assets/${src}" style="${(extra && extra.includes("pos")) ? "" : ""}"></div>`;
const picPos = (src, x, y, w, h, pos, cls) => `<div class="pic ${cls || ""}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"><img src="assets/${src}" style="object-position:${pos}"></div>`;

/* ---- the visual per mod, positioned inside a box (x,y,w,h); k scales everything ---- */
function visual(x, y, k, kind) {
  const P = (v) => Math.round(v * k);
  if (MOD === "la") {
    if (kind === "strip") return picPos("la_inv.png", x, y, P(520), P(328), "50% 2%") + picPos("la_minimap.png", x + P(390), y + P(40), P(270), P(270), "50% 45%", "round");
    return picPos("la_inv.png", x + P(90), y, P(660), P(508), "50% 0%") +
           picPos("la_minimap.png", x, y + P(400), P(400), P(400), "50% 50%", "round") +
           picPos("la_tooltip.png", x + P(560), y + P(380), P(330), P(399), "50% 50%") +
           `<div class="cap" style="left:${x + P(110)}px;top:${y - P(16)}px">rainbow frames · inventory</div>` +
           `<div class="cap" style="left:${x + P(40)}px;top:${y + P(810)}px">rainbow markers · minimap</div>`;
  }
  if (MOD === "ba") {
    if (kind === "strip") return `<div class="abs clip" data-from=".sept" data-idx="1" style="left:${x}px;top:${y}px;width:${P(640)}px;height:${P(330)}px;overflow:hidden;border:1px solid #8a6d42;box-shadow:0 0 0 5px rgba(12,9,7,.9),0 0 0 6px rgba(138,109,66,.5)">
        <div style="margin-left:${-P(1)}px">${baWindow({ fs: 17 * k, w: 650 * k, compact: true, planFrom: 7 })}</div></div>` +
        `<div class="abs" style="left:${x + P(470)}px;top:${y + P(110)}px">${baMenu({ fs: 21 * k, w: 200 * k, label: "level up · class", items: [["Fighter"], ["Ranger"], ["Rogue", 1], ["Wizard"]] })}</div>`;
    return `<div class="abs" style="left:${x + P(245)}px;top:${y}px">${baWindow({ fs: 17.5 * k, w: 680 * k, noWhy: true })}</div>` +
           `<div class="abs" style="left:${x}px;top:${y + P(500)}px">${baMenu({ fs: 24 * k, w: 255 * k, label: "level up · class", items: [["Barbarian"], ["Fighter"], ["Ranger"], ["Rogue", 1], ["Wizard"]] })}</div>` +
           `<div class="cap" style="left:${x + P(265)}px;top:${y - P(16)}px">F7 · the advisor window</div>`;
  }
}

const L = {
  banner() {
    S.innerHTML = frame(26, 18) +
      textBlock({ x: 130, y: 200, w: 760, plate: 150, eb: 21, t: 128, tg: 40, feats: 27, key: 24 }) +
      visual(MOD === "ba" ? 930 : 950, MOD === "la" ? 130 : 150, 1);
  },
  thumb() {
    let v;
    if (MOD === "la") v = picPos("la_inv.png", 112, 96, 800, 470, "50% 0%") + picPos("la_minimap.png", 650, 330, 300, 300, "50% 50%", "round");
    else if (MOD === "ba") v = `<div class="abs clip" data-from=".sept" data-idx="1" style="left:96px;top:96px;width:832px;height:480px;overflow:hidden;border:1px solid #8a6d42">
        <div style="margin-left:-1px">${baWindow({ fs: 21, w: 836, compact: true, planFrom: 7 })}</div></div>` +
        `<div class="abs" style="left:640px;top:300px">${baMenu({ fs: 26, w: 260, label: "level up · class", items: [["Fighter"], ["Ranger"], ["Rogue", 1], ["Wizard"]] })}</div>`;
    S.innerHTML = frame(22, 16) + v +
      `<div class="abs" style="left:0;right:0;top:640px;display:flex;flex-direction:column;align-items:center;text-align:center">
        <div style="display:flex;align-items:center;gap:26px">${plate(118)}<div class="title" style="font-size:96px">${M.name}</div></div>
        <div class="divider" style="width:560px;margin:24px 0 18px"><b></b></div>
        <div class="tag" style="font-size:34px;max-width:820px">${M.tag}</div>
        ${M.private ? `<div style="margin-top:22px">${stampOrKey(22)}</div>` : ""}
      </div>`;
  },
  logo() {
    // The in-game mod manager image (16:9, shown down to 244x136): the plate and the name only, both large enough to read there.
    const words = M.name.split(" ");
    S.innerHTML = frame(18, 14) +
      `<div class="abs" style="inset:0;display:flex;align-items:center;justify-content:center;gap:60px">${plate(340)}
        <div><div class="title" style="font-size:${words.length > 1 ? 152 : 136}px">${words.join("<br>")}</div>
        <div class="divider" style="width:440px;margin:34px 0 22px"><b></b></div>
        <div class="tag" style="font-size:34px">${M.private ? "Private play-testing tool." : M.short}</div></div></div>`;
  },
  docs() {
    S.innerHTML = frame(14, 12) +
      `<div class="abs" style="left:70px;top:0;bottom:0;display:flex;align-items:center;gap:40px">${plate(150)}
        <div><div class="eyebrow" style="font-size:16px;margin-bottom:12px">${M.eyebrow}</div>
        <div class="title" style="font-size:88px">${M.name}</div>
        <div class="divider" style="width:430px;margin:16px 0 12px"><b></b></div>
        <div class="tag" style="font-size:28px">${M.tag}</div>
        ${M.private ? `<div style="margin-top:14px">${stampOrKey(18)}</div>` : ""}</div></div>` +
      visual(MOD === "ba" ? 880 : 905, 36, 0.99, "strip");
  },
  sets() {
    S.innerHTML = frame(10, 10) +
      `<div class="abs" style="left:52px;top:0;bottom:0;display:flex;align-items:center;gap:30px">${plate(132)}
        <div><div class="eyebrow" style="font-size:15px;margin-bottom:8px">Loot Advisor</div>
        <div class="title" style="font-size:72px">Synergy Sets</div>
        <div class="tag" style="font-size:22px;margin-top:8px">Full loadouts for your build · follows your game live</div></div></div>` +
      `<div class="abs" style="right:44px;top:30px;width:620px;height:180px;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 30%)">
        <img src="assets/la_inv.png" style="width:620px;margin-top:-6px"></div>`;
  },
  mark(small) {
    document.body.classList.add("transparent"); S.style.background = "none"; S.classList.remove("grain");
    const p = small ? 60 : 120;
    S.innerHTML = `<div class="abs" style="left:${(small ? 64 : 128) / 2 - p / 2}px;top:${(small ? 64 : 128) / 2 - p / 2}px">${plate(p, small)}</div>`;
    S.querySelector(".plate").style.boxShadow = "none";
  },
  marksm() { L.mark(true); },
  wordmark() {
    document.body.classList.add("transparent"); S.style.background = "none"; S.classList.remove("grain");
    S.innerHTML = `<div class="abs" style="left:2px;top:4px;display:flex;align-items:center;gap:10px">${plate(56, true)}
      <div class="title" id="wm" style="font-size:31px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.95)) drop-shadow(0 0 3px rgba(0,0,0,.8));white-space:nowrap">${M.name}</div></div>`;
    S.querySelector(".plate").style.boxShadow = "none";
    window.__fit = () => { const wm = document.getElementById("wm"); let fs = 31;
      while (wm.getBoundingClientRect().right > 253 && fs > 12) { fs -= .5; wm.style.fontSize = fs + "px"; } };
  },
};
(L[FMT] || L.banner)();
BR.ready(window.__fit);
</script>
</body>
</html>
